name: CI FullStack Assesment

on:
  push:
    branches:
      - main

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SetUp Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute cache key
        id: cache-key
        run: echo "value=node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: npm install
        working-directory: codebase/rdicidr-0.1.0

      - name: Save Cache
        uses: actions/cache/save@v5
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: ${{ steps.cache-key.outputs.value }}

  lint:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SetUp Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Run Lint
        run: npm run lint
        working-directory: codebase/rdicidr-0.1.0

      - name: Run Prettier
        run: npm run prettier -- --write
        working-directory: codebase/rdicidr-0.1.0

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SetUp Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Run Test
        env:
          CI: true
        run: npm run test
        working-directory: codebase/rdicidr-0.1.0

  build:
    needs: [install, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SetUp Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: codebase/rdicidr-0.1.0/node_modules
          key: node-modules-${{ hashFiles('codebase/rdicidr-0.1.0/package-lock.json') }}

      - name: Run Build
        run: npm run build
        working-directory: codebase/rdicidr-0.1.0

  docker-push:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, sin keys estáticas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::847460071795:role/poc-role-personal-github-actions-ci
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short commit SHA)
        id: vars
        run: echo "image_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker build --platform linux/amd64 \
            -t ${{ steps.ecr-login.outputs.registry }}/rdicidr:${{ steps.vars.outputs.image_tag }} .
          docker push ${{ steps.ecr-login.outputs.registry }}/rdicidr:${{ steps.vars.outputs.image_tag }}

  update-manifest:
    needs: [docker-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump image tag in the manifest de K8s
        run: |
          sed -i "s|image: .*/rdicidr:.*|image: 847460071795.dkr.ecr.us-east-1.amazonaws.com/rdicidr:${{ needs.docker-push.outputs.image_tag }}|" k8s/aws/service.yml

      - name: Commit and push the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8/aws/service.yml
          git commit -m "chore: bump rdicidr image to ${{ needs.docker-push.outputs.image_tag }} [skip ci]"
          git push